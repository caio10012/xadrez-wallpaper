name: Pacote .deb

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Gerar o .deb
        env:
          HOMEPAGE: ${{ github.server_url }}/${{ github.repository }}
          MANTENEDOR: ${{ github.repository_owner }} <${{ github.repository_owner }}@users.noreply.github.com>
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            packaging/build-deb.sh "$GITHUB_REF_NAME"
          else
            packaging/build-deb.sh
          fi

      - name: Instalar como um usuário faria (o apt resolve as dependências)
        run: |
          sudo apt-get update
          sudo apt-get install -y ./dist/*.deb

      - name: Testar
        run: |
          xadrez-wallpaper --version
          xadrez-wallpaper testar

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb

      - name: Publicar na página de Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
          generate_release_notes: true
